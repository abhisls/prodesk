<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - RPSC Notes</title>
<style>
body{background:#eef6ff;padding:10px;font-family:Arial}
.box{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
input,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{padding:10px 15px;background:#0d5cb6;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:3px}
.btn-green{background:#0a8a42}
.btn-orange{background:#ff7a00}
.btn-red{background:red}
#exportBox{display:none;background:#f0f8ff;border:1.5px dashed #0d5cb6;padding:12px;border-radius:10px;margin-top:10px}
#exportCode{width:100%;height:150px;font-size:11px;font-family:monospace}
.card{border:1px solid #ddd;padding:8px;margin:5px 0;border-radius:8px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
</style>
</head>
<body>
<h3 style="color:#0a2a6b">Admin Panel - RPSC Notes</h3>

<div class="box">
<h4> + Naya Notes Add Karo</h4>
<input id="tag" placeholder="Tag - ex: Rajasthan GK">
<input id="title" placeholder="Title - ex: Rajasthan History Notes PDF">
<textarea id="desc" placeholder="Description"></textarea>
<input id="link" placeholder="PDF Link (Google Drive)">
<input id="img" placeholder="Image Link (Optional) - Nahi doge toh PDF icon lagega">
<button onclick="add()">Add / Save</button>
</div>

<div class="box">
<div style="display:flex;gap:6px;flex-wrap:wrap">
<button class="btn-green" onclick="exportCode()">📤 Export Code</button>
<button class="btn-orange" onclick="copyCode()">📋 Copy Code</button>
<button class="btn-red" onclick="clearAll()">Sab Delete</button>
</div>

<div id="exportBox">
<b>Ye code copy karke index.html me defaultNotes me paste karna hai taaki sabko dikhe:</b>
<textarea id="exportCode" readonly></textarea>
<p style="font-size:11px;color:#555;margin-top:6px">GitHub > index.html > Edit > defaultNotes ko
